<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qmoosa Automated Yield Aggregator & Vaults</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 2rem; }
    .card { background: #131d31; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #1e293b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .metric { font-size: 1.75rem; font-weight: 700; color: #38bdf8; margin: 0.5rem 0; }
    button { background: #0284c7; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 QMOOSA YIELD AGGREGATION & VAULTS</h1>
    <p>ERC-4626 Tokenized Multi-Strategy Yield Engine — Qmoosa 1,000 Software Ecosystem</p>
    <button id="btn-connect">Connect Web3 Wallet</button>
  </div>
  <div class="grid">
    <div class="card">
      <h3>USDC Vault TVL</h3>
      <div class="metric">$50,000,000</div>
      <p>Net APY: 9.20% | Share Price: 1.0825</p>
    </div>
    <div class="card">
      <h3>WETH Vault TVL</h3>
      <div class="metric">$85,000,000</div>
      <p>Net APY: 5.40% | Share Price: 1.1240</p>
    </div>
  </div>
</body>
</html>
